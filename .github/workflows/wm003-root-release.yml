name: WM-003 preserve completed public root verification evidence
on:
  push:
    branches: [verification/wm003-root-release]
permissions:
  contents: write
  actions: read
jobs:
  preserve-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout evidence-only branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Download completed exact browser artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34929235870 --repo timcgha/Webmaster --name wm003-public-root-save --dir evidence/wm-003/public-root-release
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('evidence/wm-003/public-root-release')
          report=json.loads((root/'report.json').read_text())
          assert report['result']=='PASS'
          assert report['sourceHead']=='f68bad52fd7b66a08fb889e87eb7268a0cecd76e'
          assert report['sourceTree']=='f1c808a922c4cd7b96c87b519e72d1ed60d71a4c'
          assert len(report['scenarios'])==3
          assert all(s['result']=='PASS' and not s['errors'] and not s['failedResponses'] for s in report['scenarios'])
          files=[]
          for p in sorted(root.iterdir()):
              data=p.read_bytes()
              files.append({'path':p.name,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'gitBlob':hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()})
          assert len(files)==7 and len(list(root.glob('*.png')))==6
          manifest={'author':'WEBMASTER_PRODUCT_OWNER','review':'SELF-REVIEW','run':34929235870,'artifact':10381151478,'artifactDigest':'sha256:d43ec0a3608c6c0c288c506f22fef26443fe39820757251f83cd33d4e7be10e9','sourceHead':report['sourceHead'],'sourceTree':report['sourceTree'],'files':files,'result':'PASS'}
          (root/'archive-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest))
          PY
      - name: Commit only completed evidence without another verification run
        run: |
          git add evidence/wm-003/public-root-release
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'WM-003: permanently retain completed public root browser evidence [skip ci]'
          git push origin HEAD:verification/wm003-root-release
