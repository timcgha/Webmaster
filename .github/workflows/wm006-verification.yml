name: WM-006 source-bound SELF_REVIEW verification
run-name: WM-006 verification ${{ github.sha }}
on:
  push:
    branches: [feat/wm006-combat-playground]
permissions:
  contents: read
concurrency:
  group: wm006-verification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Preserve exact checkout bytes
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: baseline
          ref: 6aff5802736b5c12380102a70a38794838397d7d
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: save-baseline
          ref: 3962446ca00c6e1db6bd8b250335b24619a0aeab
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: baseline4
          ref: a63ad0e05ce12d2b42ff22e97d39de4af51d4b08
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Locked install and source integrity
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          mkdir -p evidence/wm-006
          pnpm install --frozen-lockfile 2>&1 | tee evidence/wm-006/install.log
          node scripts/wm006-source-integrity.mjs
      - name: Full deterministic tests, TypeScript and save isolation
        run: |
          set -euo pipefail
          WM_TEST_EVIDENCE_ROOT=evidence/wm-006/unit pnpm test 2>&1 | tee evidence/wm-006/unit.log
          pnpm exec tsc --noEmit 2>&1 | tee evidence/wm-006/typescript.log
          node --test scripts/wm006-storage.test.mjs 2>&1 | tee evidence/wm-006/storage.log
      - name: Clean production and Pages builds, audits, source-bound payload
        run: |
          set -euo pipefail
          pnpm build 2>&1 | tee evidence/wm-006/build.log
          node scripts/wm006-build.mjs 2>&1 | tee evidence/wm-006/pages-build.log
          pnpm audit --json > evidence/wm-006/audit-all.json
          pnpm audit --prod --json > evidence/wm-006/audit-production.json
          node scripts/wm006-package.mjs
      - name: Install prescribed full Chromium
        run: pnpm exec playwright install chromium
      - name: Complete keyboard and semantic-controller course, poses and audio
        run: |
          set -euo pipefail
          pnpm exec playwright test -c playwright.wm006.config.ts e2e/wm006.spec.ts e2e/wm006-c3-visual.spec.ts e2e/wm006-cleanup.spec.ts e2e/wm006-followup.spec.ts 2>&1 | tee evidence/wm-006/browser.log
      - name: Preserve affected rendered evidence immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wm006-rendered-${{ github.sha }}
          path: |
            candidate/evidence/wm-006/
            candidate/test-results-wm006/
          retention-days: 90
      - name: Compiled route, exact historical writers and persistent save reopening
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          node scripts/wm006-compiled.mjs 2>&1 | tee evidence/wm-006/compiled.log
      - name: Affected inherited keyboard, controller, climb, pull and lifecycle journeys
        if: ${{ !cancelled() }}
        env:
          WM006_SUITE: inherited
        run: |
          set -euo pipefail
          node scripts/wm006-prepare-inherited.mjs
          pnpm exec playwright test -c playwright.wm006.config.ts e2e/wm006-refresh-wm001.spec.ts e2e/wm006-refresh-wm002.spec.ts e2e/wm006-refresh-wm003.spec.ts e2e/wm003-remediation.spec.ts e2e/wm005-climb.spec.ts e2e/wm006-refresh-current-course.spec.ts 2>&1 | tee evidence/wm-006/inherited-browser.log
      - name: Final exact-source integrity
        if: always()
        run: node scripts/wm006-source-integrity.mjs
      - name: Retain complete pass or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wm006-${{ github.sha }}
          path: |
            candidate/evidence/wm-006/
            candidate/test-results-wm006/
            candidate/.wm006-payload/
          include-hidden-files: true
          retention-days: 90
  performance:
    runs-on: windows-2025
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Preserve checkout bytes
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: baseline
          ref: 6aff5802736b5c12380102a70a38794838397d7d
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Exact locked runtime and browser
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm --dir ../baseline install --frozen-lockfile
          pnpm exec playwright install chromium
          node scripts/wm006-source-integrity.mjs
      - name: Four paired practice, swing, climb and combat-street rounds against released WM005
        run: |
          set -euo pipefail
          node scripts/wm006-performance.mjs 2>&1 | tee evidence/wm-006/performance.log
      - name: Final performance source integrity
        if: always()
        run: |
          node scripts/wm006-source-integrity.mjs
          cp evidence/wm-006/source-integrity.json evidence/wm-006/performance-source-integrity.json
      - name: Preserve complete or partial performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wm006-performance-${{ github.sha }}
          path: candidate/evidence/wm-006/performance*
          retention-days: 90
  archive:
    if: always()
    needs: [verify, performance]
    concurrency:
      group: wm006-evidence-archive
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: verification/wm006-evidence
          path: archive
          sparse-checkout: evidence/wm-006
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wm006-${{ github.sha }}
          path: retained
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wm006-performance-${{ github.sha }}
          path: retained/evidence/wm-006
      - name: Preserve immutable source-bound evidence and manifest
        shell: bash
        run: |
          set -euo pipefail
          target="archive/evidence/wm-006/${GITHUB_SHA}/${GITHUB_RUN_ID}"
          mkdir -p "$target"
          cp -r retained/. "$target/"
          node - "$target" <<'JS'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),root=process.argv[2],files=[];
          function scan(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())scan(p);else{const b=fs.readFileSync(p);files.push({path:path.relative(root,p).replaceAll('\\','/'),bytes:b.length,sha256:crypto.createHash('sha256').update(b).digest('hex')});}}}scan(root);
          fs.writeFileSync(path.join(root,'archive-manifest.json'),JSON.stringify({source:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,role:'WEBMASTER_PRODUCT_OWNER',classification:'SELF_REVIEW evidence, not independent QA',files},null,2));
          JS
          git -C archive config user.name WEBMASTER_PRODUCT_OWNER
          git -C archive config user.email webmaster-po@users.noreply.github.com
          git -C archive add -f evidence/wm-006
          git -C archive commit -m "WM-006 retain exact-source run ${GITHUB_RUN_ID} evidence [skip ci]"
          git -C archive push origin HEAD:verification/wm006-evidence
