name: WM004 cycle4 failed-route and ceiling recheck
# Exact PR4 source remains unchanged. This verification-only rerun preserves
# development/test semantics while excluding retained browser output from Vite's watcher.
on:
  push:
    branches: [verification/wm004-evidence]
    paths: [.github/workflows/wm004-cycle4-recheck.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Preserve exact checkout bytes
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 504f6087beef67daf0a88e6de27a21a1b6b10a28
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Locked install, TypeScript build and full Chromium
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install chromium
      - name: Exact source before recheck
        run: node scripts/wm004-source-integrity.mjs
      - name: Prepare watcher-exclusion harness
        run: |
          cp scripts/wm004-devserver.mjs scripts/.wm004-devserver-recheck.mjs
          sed -i "s#watch:null#watch:{ignored:['**/test-results-wm004/**']}#" scripts/.wm004-devserver-recheck.mjs
          cp playwright.wm004.config.ts playwright.wm004.recheck.config.ts
          sed -i 's#node scripts/wm004-devserver.mjs#node scripts/.wm004-devserver-recheck.mjs#' playwright.wm004.recheck.config.ts
      - name: Four prior failures and both WM003 ceiling journeys
        timeout-minutes: 15
        env:
          WM004_SUITE: cycle4-focused
        run: pnpm exec playwright test -c playwright.wm004.recheck.config.ts e2e/wm001.spec.ts e2e/wm003.spec.ts e2e/wm003-remediation.spec.ts --grep "disconnect releases motion|supports connection after load|persists a Hard run|genuine roof2 checkpoint|WM003 ordinary keyboard combined|WM003 simulated PlayStation complete"
      - name: Exact source after recheck
        if: always()
        run: |
          rm -f playwright.wm004.recheck.config.ts scripts/.wm004-devserver-recheck.mjs
          node scripts/wm004-source-integrity.mjs
      - name: Retain focused evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wm004-cycle4-focused-${{ github.run_id }}
          path: |
            candidate/evidence/wm-004/
            candidate/test-results-wm004/cycle4-focused/
          include-hidden-files: true
          retention-days: 30
