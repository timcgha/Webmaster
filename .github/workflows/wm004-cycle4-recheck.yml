name: WM004 cycle4 inherited regression recheck
# Exact PR4 source remains unchanged; this is a verification-only rerun using
# Vite's non-watching preview server after the Windows dev watcher crashed on
# a locked Chromium profile cookie database.
on:
  push:
    branches: [verification/wm004-evidence]
    paths: [.github/workflows/wm004-cycle4-recheck.yml]
permissions:
  contents: read
jobs:
  inherited:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Preserve exact checkout bytes
        working-directory: ${{ github.workspace }}
        run: git config --global core.autocrlf false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: candidate
          ref: 504f6087beef67daf0a88e6de27a21a1b6b10a28
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Locked install, clean build and full Chromium
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install chromium
      - name: Exact source before recheck
        run: node scripts/wm004-source-integrity.mjs
      - name: Prepare non-watching verification config
        run: |
          cp playwright.wm004.config.ts playwright.wm004.preview.config.ts
          sed -i 's#node scripts/wm004-devserver.mjs#pnpm preview --host 127.0.0.1 --port 4173#' playwright.wm004.preview.config.ts
      - name: Complete inherited S1-S3 rendered regressions
        timeout-minutes: 20
        env:
          WM004_SUITE: cycle4-inherited-preview
        run: pnpm exec playwright test -c playwright.wm004.preview.config.ts e2e/wm001.spec.ts e2e/wm002.spec.ts e2e/wm003.spec.ts e2e/wm003-remediation.spec.ts
      - name: Exact source after recheck
        if: always()
        run: |
          rm -f playwright.wm004.preview.config.ts
          node scripts/wm004-source-integrity.mjs
      - name: Retain bounded recheck
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wm004-cycle4-inherited-${{ github.run_id }}
          path: |
            candidate/evidence/wm-004/
            candidate/test-results-wm004/cycle4-inherited-preview/
          include-hidden-files: true
          retention-days: 30
