name: WM-003 W2 DIAGNOSTIC ONLY
run-name: WM-003 W2 DIAGNOSTIC ONLY ${{ github.sha }}

on:
  push:
    branches: [release/webmaster-v1]

permissions:
  contents: read

concurrency:
  group: wm003-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Preserve exact checkout bytes on Windows
        timeout-minutes: 1
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global --get core.autocrlf
      - name: Check out exact candidate
        timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified official ref
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node
        timeout-minutes: 2
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate exact package manager and record identity
        timeout-minutes: 3
        id: identity
        run: |
          echo 'DIAGNOSTIC_ONLY: four selected candidate cases and two baseline FPS cases. No full-suite or acceptance result.'
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          node --version
          pnpm --version
          git show -s --format='head=%H%ntree=%T%nparents=%P' HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const previous='b3da7ce1de4dbe0a4a2532d0abffe903d38b69c7';
          const changed=execFileSync('git',['diff','--name-only',previous,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          assert.deepEqual(changed,['.github/workflows/wm003-verification.yml'],'W2 must change only the verification workflow');
          const files=[];
          for(const entry of execFileSync('git',['ls-files','-s','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            const [meta,name]=entry.split('\t');
            if(name.startsWith('evidence/')&&!name.startsWith('evidence/wm-003/legacy-saves/'))continue;
            const bytes=fs.readFileSync(name),expected=meta.split(' ')[1];
            const blob=crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            assert.equal(blob,expected,`Checkout bytes changed: ${name}`);
            files.push({path:name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),gitBlob:blob});
          }
          assert.equal(files.length,47);
          const identity={head:process.env.GITHUB_SHA,tree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),previous,changed,files,node:process.version,platform:process.platform,release:os.release(),arch:os.arch(),cpuCount:os.cpus().length,cpuModel:os.cpus()[0]?.model,totalMemory:os.totalmem()};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'wm003-source-start.json'),JSON.stringify(identity));
          console.log(JSON.stringify({...identity,mode:'DIAGNOSTIC_ONLY',metadataCorrection:'Measurement JSON retains historical Linux wording; actual OS is this Windows runtime. No physical-device claim.'},null,2));
          JS
      - name: Locked candidate install
        timeout-minutes: 4
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Install pinned Playwright Chromium runtime
        timeout-minutes: 6
        id: browser
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm exec playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch();
          try{
            const page=await browser.newPage();
            const graphics=await page.evaluate(()=>{
              const gl=document.createElement('canvas').getContext('webgl2');
              if(!gl)return {webgl2:false};
              const ext=gl.getExtension('WEBGL_debug_renderer_info');
              return {webgl2:true,version:gl.getParameter(gl.VERSION),vendor:ext?gl.getParameter(ext.UNMASKED_VENDOR_WEBGL):null,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):null};
            });
            console.log(JSON.stringify({method:'Default Playwright launch; blank-page runtime identity only',browserVersion:browser.version(),executable:chromium.executablePath(),graphics}));
          }finally{await browser.close();}
          JS
      - name: DIAGNOSTIC ONLY unchanged save cases and candidate FPS
        id: rendered
        timeout-minutes: 7
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        env:
          WM_MEASUREMENT_LABEL: github-w2-candidate
          WM_MEASUREMENT_OUTPUT: evidence/wm-003/ci-w2
        run: pnpm exec playwright test e2e/wm003-remediation.spec.ts e2e/wm002-performance.spec.ts --project=chromium --workers=1 --reporter=list
      - name: Preserve candidate diagnostics after success failure or cancellation
        id: candidate_diagnostics
        timeout-minutes: 2
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          WM_DIAGNOSTIC_ROOT: candidate
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const root=path.resolve(process.env.WM_DIAGNOSTIC_ROOT),files=[];
          let collectedSourceHead='MISSING',collectedSourceTree='MISSING',collectedIdentityError=null;
          if(fs.existsSync(root))try{
            collectedSourceHead=execFileSync('git',['rev-parse','HEAD'],{cwd:root,encoding:'utf8'}).trim();
            collectedSourceTree=execFileSync('git',['rev-parse','HEAD^{tree}'],{cwd:root,encoding:'utf8'}).trim();
          }catch(error){collectedIdentityError=String(error.message);}
          const excluded=['wm003-persistent-profile','skyline-persistent-profile'];
          const walk=(directory,allJSON=false)=>{
            if(!fs.existsSync(directory))return;
            for(const item of fs.readdirSync(directory,{withFileTypes:true})){
              const file=path.join(directory,item.name);
              if(item.isDirectory()){if(!excluded.includes(item.name))walk(file,allJSON);}
              else if(item.isFile()&&(item.name==='error-context.md'||item.name==='.last-run.json'||/^(last-state|legacy-last-state|state|rendered-.+|resources|negative-lifecycle|presentation-phases|controller-cleanup)\.json$/.test(item.name)||(allJSON&&item.name.endsWith('.json'))))files.push(file);
            }
          };
          walk(path.join(root,'test-results'));
          walk(path.join(root,'evidence/wm-003/ci-w2'),true);
          walk(path.join(root,'evidence/wm-003/remediation-r1/captures'),true);
          const recorded=[];let used=0;
          for(const file of [...new Set(files)].sort()){
            const bytes=fs.readFileSync(file),limit=Math.min(bytes.length,81920,Math.max(0,524288-used));
            const record={path:path.relative(root,file),bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),loggedBytes:limit,truncated:limit<bytes.length};
            recorded.push(record);console.log(JSON.stringify(record));
            if(limit)console.log(bytes.subarray(0,limit).toString('utf8'));used+=limit;
          }
          const states=recorded.filter(x=>/(?:^|[\\/])(?:last-state|legacy-last-state|state)\.json$/.test(x.path)).map(x=>x.path);
          console.log(JSON.stringify({mode:'DIAGNOSTIC_ONLY',workflowSourceHead:process.env.GITHUB_SHA,collectedSourceHead,collectedSourceTree,collectedIdentityError,root,rootAvailable:fs.existsSync(root),recorded,availableStateFiles:states,missingStates:'Only existing state files are listed. Failed assertions without a state file remain MISSING; error-context/list-reporter details are retained when available.',loggedBytes:used,limits:{perFile:81920,total:524288},excludedProfiles:excluded,media:'No image/video/profile/trace upload or base64 media output.'},null,2));
          JS
      - name: Verify tested candidate source stayed unchanged
        timeout-minutes: 1
        id: source
        if: always()
        continue-on-error: true
        run: |
          git diff --exit-code HEAD -- src tests e2e scripts .github package.json pnpm-lock.yaml playwright.config.ts tsconfig.json vite.config.ts vitest.config.ts
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'wm003-source-start.json'),'utf8'));
          for(const file of before.files){const bytes=fs.readFileSync(file.path);assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),file.sha256,file.path);}
          console.log(JSON.stringify({sourceHead:process.env.GITHUB_SHA,exactSourceFiles:before.files.length,byteIntegrity:'PASS'}));
          JS
      - name: Check out exact merged WM-002 baseline
        timeout-minutes: 2
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6ae9d2ea23f212be31709e76ff5a3302c96cc3b4
          path: baseline
          persist-credentials: false
          fetch-depth: 2
      - name: Locked baseline install
        timeout-minutes: 4
        id: baseline_install
        continue-on-error: true
        working-directory: baseline
        run: |
          git show -s --format='head=%H%ntree=%T' HEAD
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'6ae9d2ea23f212be31709e76ff5a3302c96cc3b4');
          let verified=0;
          for(const entry of execFileSync('git',['ls-files','-s','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            const [meta,name]=entry.split('\t');if(name.startsWith('evidence/'))continue;
            const bytes=fs.readFileSync(name),blob=crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            assert.equal(blob,meta.split(' ')[1],`Baseline checkout bytes changed: ${name}`);verified++;
          }
          console.log(JSON.stringify({baselineExactSourceFiles:verified,byteIntegrity:'PASS'}));
          JS
          pnpm install --frozen-lockfile
      - name: Same-runner baseline FPS measurements
        timeout-minutes: 4
        id: baseline_rendered
        if: steps.baseline_install.outcome == 'success' && steps.browser.outcome == 'success'
        continue-on-error: true
        working-directory: baseline
        env:
          WM_MEASUREMENT_LABEL: github-w2-baseline
          WM_MEASUREMENT_OUTPUT: evidence/wm-003/ci-w2
        run: pnpm exec playwright test e2e/wm002-performance.spec.ts --project=chromium --workers=1 --reporter=list
      - name: Preserve baseline diagnostics after success failure or cancellation
        id: baseline_diagnostics
        timeout-minutes: 2
        if: always()
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        env:
          WM_DIAGNOSTIC_ROOT: baseline
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const root=path.resolve(process.env.WM_DIAGNOSTIC_ROOT),files=[];
          let collectedSourceHead='MISSING',collectedSourceTree='MISSING',collectedIdentityError=null;
          if(fs.existsSync(root))try{
            collectedSourceHead=execFileSync('git',['rev-parse','HEAD'],{cwd:root,encoding:'utf8'}).trim();
            collectedSourceTree=execFileSync('git',['rev-parse','HEAD^{tree}'],{cwd:root,encoding:'utf8'}).trim();
          }catch(error){collectedIdentityError=String(error.message);}
          const excluded=['wm003-persistent-profile','skyline-persistent-profile'];
          const walk=(directory,allJSON=false)=>{
            if(!fs.existsSync(directory))return;
            for(const item of fs.readdirSync(directory,{withFileTypes:true})){
              const file=path.join(directory,item.name);
              if(item.isDirectory()){if(!excluded.includes(item.name))walk(file,allJSON);}
              else if(item.isFile()&&(item.name==='error-context.md'||item.name==='.last-run.json'||/^(last-state|legacy-last-state|state|rendered-.+|resources|negative-lifecycle|presentation-phases|controller-cleanup)\.json$/.test(item.name)||(allJSON&&item.name.endsWith('.json'))))files.push(file);
            }
          };
          walk(path.join(root,'test-results'));
          walk(path.join(root,'evidence/wm-003/ci-w2'),true);
          walk(path.join(root,'evidence/wm-003/remediation-r1/captures'),true);
          const recorded=[];let used=0;
          for(const file of [...new Set(files)].sort()){
            const bytes=fs.readFileSync(file),limit=Math.min(bytes.length,81920,Math.max(0,524288-used));
            const record={path:path.relative(root,file),bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),loggedBytes:limit,truncated:limit<bytes.length};
            recorded.push(record);console.log(JSON.stringify(record));
            if(limit)console.log(bytes.subarray(0,limit).toString('utf8'));used+=limit;
          }
          const states=recorded.filter(x=>/(?:^|[\\/])(?:last-state|legacy-last-state|state)\.json$/.test(x.path)).map(x=>x.path);
          console.log(JSON.stringify({mode:'DIAGNOSTIC_ONLY',workflowSourceHead:process.env.GITHUB_SHA,collectedSourceHead,collectedSourceTree,collectedIdentityError,root,rootAvailable:fs.existsSync(root),recorded,availableStateFiles:states,missingStates:'Only existing state files are listed. Failed assertions without a state file remain MISSING; error-context/list-reporter details are retained when available.',loggedBytes:used,limits:{perFile:81920,total:524288},excludedProfiles:excluded,media:'No image/video/profile/trace upload or base64 media output.'},null,2));
          JS
      - name: DIAGNOSTIC ONLY outcomes and final status
        timeout-minutes: 1
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          GATE_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import os from 'node:os';
          const steps=JSON.parse(process.env.GATE_OUTCOMES);
          const required=['identity','install','browser','rendered','candidate_diagnostics','source','baseline_install','baseline_rendered','baseline_diagnostics'];
          const outcomes=Object.fromEntries(required.map(k=>[k,steps[k]?.outcome??'not_run']));
          const result={mode:'DIAGNOSTIC_ONLY',sourceHead:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,os:{platform:process.platform,release:os.release()},outcomes,planned:{candidateSaveCases:2,candidateFPSCases:2,baselineFPSCases:2,full44Suite:'NOT_RUN'},carriedForward:'W1 on b3da7ce:172 units,TypeScript,production/Pages builds and47-source-byte integrity passed. These gates are NOT_RUN_FRESH in W2. Compiled smoke/audits are omitted here; prior evidence remains historical.',interpretation:'Selected-case outcomes only. No full-suite PASS, source acceptance, physical-device proof or threshold waiver. Historical measurement Linux wording is stale; actual OS is Windows. Failed FPS floors remain NOT_MET.'};
          console.log(JSON.stringify(result,null,2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## WM-003 W2 DIAGNOSTIC ONLY\n\n'+JSON.stringify(result,null,2)+'\n');
          if(Object.values(outcomes).some(v=>v!=='success'))process.exitCode=1;
          JS
