name: WM-003 exact candidate verification
run-name: WM-003 verification ${{ github.sha }}

on:
  push:
    branches: [release/webmaster-v1]

permissions:
  contents: read

concurrency:
  group: wm003-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: candidate
    steps:
      - name: Preserve exact checkout bytes on Windows
        working-directory: ${{ github.workspace }}
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global --get core.autocrlf
      - name: Check out exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, verified official ref
        with:
          ref: ${{ github.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate exact package manager and record identity
        id: identity
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate
          node --version
          pnpm --version
          git show -s --format='head=%H%ntree=%T%nparents=%P' HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import os from 'node:os';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const previous='ff675d643f6650b672ee79e8b0983e823cc9558e';
          const changed=execFileSync('git',['diff','--name-only',previous,'HEAD'],{encoding:'utf8'}).trim().split('\n');
          assert.deepEqual(changed,['.github/workflows/wm003-verification.yml'],'W1 must change only the verification workflow');
          const files=[];
          for(const entry of execFileSync('git',['ls-files','-s','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            const [meta,name]=entry.split('\t');
            if(name.startsWith('evidence/')&&!name.startsWith('evidence/wm-003/legacy-saves/'))continue;
            const bytes=fs.readFileSync(name),expected=meta.split(' ')[1];
            const blob=crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            assert.equal(blob,expected,`Checkout bytes changed: ${name}`);
            files.push({path:name,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),gitBlob:blob});
          }
          assert.equal(files.length,47);
          const identity={head:process.env.GITHUB_SHA,tree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),previous,changed,files,node:process.version,platform:process.platform,release:os.release(),arch:os.arch(),cpuCount:os.cpus().length,cpuModel:os.cpus()[0]?.model,totalMemory:os.totalmem()};
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'wm003-source-start.json'),JSON.stringify(identity));
          console.log(JSON.stringify(identity,null,2));
          JS
      - name: Locked candidate install
        id: install
        continue-on-error: true
        run: pnpm install --frozen-lockfile
      - name: Complete deterministic suite
        id: units
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm test
      - name: TypeScript
        id: types
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec tsc --noEmit
      - name: Fresh production build
        id: production
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec vite build --outDir "$RUNNER_TEMP/wm003-production" --emptyOutDir
      - name: Fresh Pages-base build
        id: pages
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm exec vite build --base=/Webmaster/ --outDir "$RUNNER_TEMP/wm003-pages" --emptyOutDir
      - name: Install pinned Playwright Chromium runtime
        id: browser
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          pnpm exec playwright install --with-deps chromium
          node --input-type=module <<'JS'
          import {chromium} from '@playwright/test';
          const browser=await chromium.launch();
          try{
            const page=await browser.newPage();
            const graphics=await page.evaluate(()=>{
              const gl=document.createElement('canvas').getContext('webgl2');
              if(!gl)return {webgl2:false};
              const ext=gl.getExtension('WEBGL_debug_renderer_info');
              return {webgl2:true,version:gl.getParameter(gl.VERSION),vendor:ext?gl.getParameter(ext.UNMASKED_VENDOR_WEBGL):null,renderer:ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):null};
            });
            console.log(JSON.stringify({method:'Default Playwright launch; blank-page runtime identity only',browserVersion:browser.version(),executable:chromium.executablePath(),graphics}));
          }finally{await browser.close();}
          JS
      - name: Complete candidate Chromium suite
        id: rendered
        if: steps.browser.outcome == 'success'
        continue-on-error: true
        env:
          WM_MEASUREMENT_LABEL: github-candidate
          WM_MEASUREMENT_OUTPUT: evidence/wm-003/ci
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const root='evidence/wm-003/captures',before={};
          if(fs.existsSync(root))for(const name of fs.readdirSync(root))if(name.endsWith('.json')){
            const file=path.join(root,name);before[file]=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
          }
          fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'wm003-diagnostics-before.json'),JSON.stringify(before));
          JS
          pnpm exec playwright test --project=chromium --workers=1 --reporter=list
      - name: Preserve bounded candidate failure and timing diagnostics in logs
        id: diagnostics
        if: always() && (steps.rendered.outcome == 'success' || steps.rendered.outcome == 'failure')
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          const snapshot=path.join(process.env.RUNNER_TEMP,'wm003-diagnostics-before.json');
          const before=fs.existsSync(snapshot)?JSON.parse(fs.readFileSync(snapshot,'utf8')):null;
          const files=[];let used=0;
          const walk=(root)=>{if(!fs.existsSync(root))return;for(const item of fs.readdirSync(root,{withFileTypes:true})){
            const file=path.join(root,item.name);
            if(item.isDirectory()){if(!['wm003-persistent-profile','skyline-persistent-profile'].includes(item.name))walk(file);}
            else if(item.name==='error-context.md'||item.name==='.last-run.json'||/^(last-state|legacy-last-state|state|rendered-.+|resources|negative-lifecycle|presentation-phases|controller-cleanup)\.json$/.test(item.name))files.push(file);
          }};
          walk('test-results');
          const captureRoot='evidence/wm-003/captures';
          if(before&&fs.existsSync(captureRoot))for(const name of fs.readdirSync(captureRoot))if(name.endsWith('.json')){
            const file=path.join(captureRoot,name),hash=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if(hash!==before[file])files.push(file);
          }
          const recorded=[];
          for(const file of [...new Set(files)].sort()){
            const bytes=fs.readFileSync(file),available=Math.max(0,524288-used),limit=Math.min(bytes.length,81920,available);
            const record={path:file,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),loggedBytes:limit,truncated:limit<bytes.length};
            recorded.push(record);console.log(JSON.stringify(record));
            if(limit)console.log(bytes.subarray(0,limit).toString('utf8'));used+=limit;
          }
          console.log(JSON.stringify({sourceHead:process.env.GITHUB_SHA,phase:'after complete candidate suite, before compiled smoke and baseline',recorded,loggedBytes:used,limits:{perFile:81920,total:524288},priorCaptureSnapshotAvailable:!!before,missingFailureStates:'Only existing files printed. A failure with no state file remains without state evidence.',media:'No image, video, trace, browser profile, artifact upload or base64 media output.'},null,2));
          JS
      - name: Compiled Pages-base genuine route smoke
        id: smoke
        if: steps.browser.outcome == 'success' && steps.pages.outcome == 'success'
        continue-on-error: true
        env:
          WM_DIST_ROOT: ${{ runner.temp }}/wm003-pages
        run: node --experimental-strip-types scripts/wm003-built-smoke.mjs
      - name: Production dependency audit
        id: production_audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm audit --prod --json
      - name: Complete dependency audit
        id: complete_audit
        if: steps.install.outcome == 'success'
        continue-on-error: true
        run: pnpm audit --json
      - name: Verify tested candidate source stayed unchanged
        id: source
        if: always()
        continue-on-error: true
        run: |
          git diff --exit-code HEAD -- src tests e2e scripts .github package.json pnpm-lock.yaml playwright.config.ts tsconfig.json vite.config.ts vitest.config.ts
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          const before=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'wm003-source-start.json'),'utf8'));
          for(const file of before.files){const bytes=fs.readFileSync(file.path);assert.equal(crypto.createHash('sha256').update(bytes).digest('hex'),file.sha256,file.path);}
          console.log(JSON.stringify({sourceHead:process.env.GITHUB_SHA,exactSourceFiles:before.files.length,byteIntegrity:'PASS'}));
          JS
      - name: Check out exact merged WM-002 baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: 6ae9d2ea23f212be31709e76ff5a3302c96cc3b4
          path: baseline
          persist-credentials: false
          fetch-depth: 2
      - name: Locked baseline install
        id: baseline_install
        continue-on-error: true
        working-directory: baseline
        run: |
          git show -s --format='head=%H%ntree=%T' HEAD
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),'6ae9d2ea23f212be31709e76ff5a3302c96cc3b4');
          let verified=0;
          for(const entry of execFileSync('git',['ls-files','-s','-z'],{encoding:'utf8'}).split('\0').filter(Boolean)){
            const [meta,name]=entry.split('\t');if(name.startsWith('evidence/'))continue;
            const bytes=fs.readFileSync(name),blob=crypto.createHash('sha1').update(`blob ${bytes.length}\0`).update(bytes).digest('hex');
            assert.equal(blob,meta.split(' ')[1],`Baseline checkout bytes changed: ${name}`);verified++;
          }
          console.log(JSON.stringify({baselineExactSourceFiles:verified,byteIntegrity:'PASS'}));
          JS
          pnpm install --frozen-lockfile
      - name: Same-runner baseline FPS measurements
        id: baseline_rendered
        if: steps.baseline_install.outcome == 'success' && steps.browser.outcome == 'success'
        continue-on-error: true
        working-directory: baseline
        env:
          WM_MEASUREMENT_LABEL: github-baseline
          WM_MEASUREMENT_OUTPUT: evidence/wm-003/ci
        run: pnpm exec playwright test e2e/wm002-performance.spec.ts --project=chromium --workers=1 --reporter=list
      - name: Source-bound results and final gate
        if: always()
        env:
          GATE_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const steps=JSON.parse(process.env.GATE_OUTCOMES);
          const gates=['identity','install','units','types','production','pages','browser','rendered','diagnostics','smoke','production_audit','complete_audit','source','baseline_install','baseline_rendered'];
          const results=Object.fromEntries(gates.map(k=>[k,steps[k]?.outcome??'not_run']));
          const identity={head:process.env.GITHUB_SHA,tree:execFileSync('git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim(),run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,node:process.version};
          console.log(JSON.stringify({identity,results},null,2));
          for(const root of ['evidence/wm-003/ci','../baseline/evidence/wm-003/ci'])
            if(fs.existsSync(root))for(const file of fs.readdirSync(root))
              if(file.endsWith('.json'))console.log(root+'/'+file+'\n'+fs.readFileSync(path.join(root,file),'utf8'));
          for(const name of ['build-manifest.json','built-runtime-smoke.json']){
            const file='evidence/wm-003/'+name;
            if(!fs.existsSync(file))continue;
            const data=JSON.parse(fs.readFileSync(file,'utf8'));
            if(data.sourceHead===process.env.GITHUB_SHA)console.log(name+'\n'+JSON.stringify(data,null,2));
          }
          const summary=['## WM-003 exact candidate verification','',JSON.stringify(identity),'','| Gate | Outcome |','| --- | --- |',...Object.entries(results).map(([k,v])=>`| ${k} | ${v} |`),'','Logs only. No deployment, cache, artifact upload, merge or acceptance is performed. Absolute FPS failures remain NOT_MET.'];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary.join('\n')+'\n');
          if(Object.values(results).some(v=>v!=='success'))process.exitCode=1;
          JS
